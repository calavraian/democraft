<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoCraft Starter Composition</title>
  <style>
    :root {
      --bg: #f5f3ec;
      --surface: #fbf9f2;
      --border: #e5e2d9;
      --ink: #18181b;
      --muted: #52525b;
      --accent: #059669;
      --accent-soft: rgba(5, 150, 105, 0.14);
      --mesh-stroke: rgba(5, 150, 105, 0.22);
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    #mesh-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 1400px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8%;
    }

    .scene {
      display: none;
      width: 100%;
      max-width: 920px;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-style: preserve-3d;
    }

    .card-3d {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 28px;
      padding: 44px;
      box-shadow: 0 32px 72px rgba(24, 24, 27, 0.12);
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 72px;
      line-height: 1.06;
      letter-spacing: -0.03em;
    }

    p.sub {
      margin: 0;
      font-size: 32px;
      line-height: 1.38;
      color: var(--muted);
    }

    /* Caption Bar (auto-adapts to vertical vs landscape/square safe zones) */
    #democraft-caption-wrap {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 64px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 40;
    }

    body.format-vertical #democraft-caption-wrap {
      bottom: auto;
      top: 1320px;
      left: 52px;
      right: 164px;
      justify-content: flex-start;
    }

    #democraft-caption-bar {
      display: none;
      max-width: 1320px;
      background: rgba(24, 24, 27, 0.9);
      color: #fbf9f2;
      border-left: 6px solid var(--accent);
      border-radius: 18px;
      padding: 20px 28px;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.34;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
    }

    /* Optional QA Safe-Zone Overlay */
    #safe-zone-overlay {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 90;
    }
    .sz-top {
      position: absolute; top: 0; left: 0; right: 0; height: 250px;
      background: rgba(225, 29, 72, 0.22); border-bottom: 2px dashed #e11d48;
    }
    .sz-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; height: 384px;
      background: rgba(225, 29, 72, 0.22); border-top: 2px dashed #e11d48;
    }
    .sz-right {
      position: absolute; top: 960px; bottom: 384px; right: 0; width: 140px;
      background: rgba(217, 119, 6, 0.25); border-left: 2px dashed #d97706;
    }
  </style>
</head>
<body>
  <canvas id="mesh-canvas"></canvas>

  <main id="stage">
    <section id="scene-1" class="scene">
      <div class="card-3d" id="card-1">
        <div class="badge">DemoCraft v1.0</div>
        <h1>Product Hook Goes Here</h1>
        <p class="sub">Replace with real grounded copy and authentic brand visuals.</p>
      </div>
    </section>

    <section id="scene-2" class="scene">
      <div class="card-3d" id="card-2">
        <div class="badge">Core Flow</div>
        <h1>Show the Product in Action</h1>
        <p class="sub">Deterministic HTML/CSS 3D + animated wireframe mesh.</p>
      </div>
    </section>
  </main>

  <div id="democraft-caption-wrap">
    <div id="democraft-caption-bar"></div>
  </div>

  <div id="safe-zone-overlay">
    <div class="sz-top"></div>
    <div class="sz-bottom"></div>
    <div class="sz-right"></div>
  </div>

  <script>
    const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
    const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);

    let CAPTIONS = [];

    function syncViewportClass() {
      const isVertical = window.innerHeight > window.innerWidth;
      document.body.classList.toggle("format-vertical", isVertical);
    }

    function drawWireframeMesh(t) {
      const canvas = document.getElementById("mesh-canvas");
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, w, h);

      const cols = 16;
      const rows = 12;
      const fov = Math.min(w, h) * 0.9;
      const horizonY = h * 0.56;
      const points = [];

      for (let r = 0; r < rows; r++) {
        const rowPts = [];
        const z = 1.6 + r * 0.55 - ((t * 0.45) % 0.55);
        for (let c = 0; c < cols; c++) {
          const nx = (c / (cols - 1) - 0.5) * 8.5;
          const wave = Math.sin(nx * 0.9 + t * 1.4) * 0.22 + Math.cos(z * 1.1 - t * 1.1) * 0.16;
          const y3d = 1.45 + wave;
          const sx = w * 0.5 + (nx / z) * fov;
          const sy = horizonY + (y3d / z) * fov * 0.65;
          rowPts.push([sx, sy]);
        }
        points.push(rowPts);
      }

      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--mesh-stroke").trim() || "rgba(5,150,105,0.22)";
      ctx.lineWidth = 1.5;

      for (let r = 0; r < rows; r++) {
        ctx.beginPath();
        for (let c = 0; c < cols; c++) {
          const [x, y] = points[r][c];
          if (c === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      for (let c = 0; c < cols; c++) {
        ctx.beginPath();
        for (let r = 0; r < rows; r++) {
          const [x, y] = points[r][c];
          if (r === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    function updateCaptions(t) {
      const bar = document.getElementById("democraft-caption-bar");
      const active = CAPTIONS.find((c) => t >= c.start && t <= c.end);
      if (!active) {
        bar.style.display = "none";
        return;
      }
      const fadeIn = easeOutCubic((t - active.start) / 0.18);
      const fadeOut = easeOutCubic((active.end - t) / 0.15);
      const alpha = Math.min(fadeIn, fadeOut);
      bar.style.display = "block";
      bar.style.opacity = alpha.toFixed(3);
      bar.style.transform = `translateY(${((1 - fadeIn) * 14).toFixed(1)}px)`;
      bar.textContent = active.text;
    }

    window.__DEMOCRAFT_SET_CAPTIONS__ = function (cues) {
      CAPTIONS = Array.isArray(cues) ? cues : [];
    };

    window.__DEMOCRAFT_TOGGLE_SAFE_ZONES__ = function (enabled) {
      const el = document.getElementById("safe-zone-overlay");
      el.style.display = enabled ? "block" : "none";
    };

    window.__DEMOCRAFT_SEEK__ = function (t) {
      syncViewportClass();
      drawWireframeMesh(t);

      const s1 = document.getElementById("scene-1");
      const c1 = document.getElementById("card-1");
      const s2 = document.getElementById("scene-2");
      const c2 = document.getElementById("card-2");

      if (t < 3.0) {
        const p = easeOutCubic(t / 0.55);
        const rotY = (1 - p) * -14 + Math.sin(t * 0.9) * 2.5;
        const rotX = (1 - p) * 10;
        s1.style.display = "flex";
        s2.style.display = "none";
        c1.style.opacity = p.toFixed(3);
        c1.style.transform = `translateY(${((1 - p) * 40).toFixed(1)}px) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
      } else {
        const lt = t - 3.0;
        const p = easeOutCubic(lt / 0.55);
        const rotY = (1 - p) * 14 + Math.cos(lt * 0.9) * 2.5;
        s1.style.display = "none";
        s2.style.display = "flex";
        c2.style.opacity = p.toFixed(3);
        c2.style.transform = `translateY(${((1 - p) * 40).toFixed(1)}px) rotateY(${rotY.toFixed(2)}deg)`;
      }

      updateCaptions(t);
      return true;
    };

    window.__DEMOCRAFT_SEEK__(0);
  </script>
</body>
</html>
